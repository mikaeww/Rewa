name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 2.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version 3.12.0 --yes --no-progress
          $NsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path -LiteralPath (Join-Path $NsisDirectory 'makensis.exe'))) {
            throw "Chocolatey did not install makensis.exe below $NsisDirectory"
          }
          $NsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test NSIS installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version '${{ inputs.version }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Rewa-${{ inputs.version }}-Windows-x64
          path: |
            dist/windows/Rewa-${{ inputs.version }}-x64-setup.exe
            dist/windows/Rewa-${{ inputs.version }}-x64-build.json
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $Tag = "v$env:RELEASE_VERSION"
          gh release create $Tag `
            "dist/windows/Rewa-$env:RELEASE_VERSION-x64-setup.exe" `
            "dist/windows/Rewa-$env:RELEASE_VERSION-x64-build.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Rewa $env:RELEASE_VERSION" `
            --notes "Wreath is now Rewa, with a new icon and a rebuilt Windows interface: a quiet frame and stage card, replay state and Save clip at the foot of a sidebar that folds smoothly, recording options in a popover instead of toolbars, clean clip cards, redesigned settings, collections, preview and editor, and spring animations throughout. Installing Rewa over Wreath keeps your settings, favourites, clips and autostart and removes the old Wreath program."
