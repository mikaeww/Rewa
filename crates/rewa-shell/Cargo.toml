[package]
name = "rewa-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Platform-neutral state, strings and motion shared by the Rewa interfaces"

[dependencies]
rewa-core = { path = "../rewa-core" }
rewa-windows = { path = "../rewa-windows" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Time",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
